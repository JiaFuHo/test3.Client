<header class="sticky-top">
  <nav class="navbar navbar-expand-md" [class.glassmorphism]="isToggle()"
    [style.background]="isToggle() ? 'var(--c1-green1---075)' : 'linear-gradient(180deg, var(--c1-green1---075) 0%, var(--c1-green1---050) 50%, var(--c1-green1---025) 100%)'">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">
        <img id="logoH" src="/images/logoH.png">
      </a>

      <button type="button" class="navbar-toggler border-0" (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="menu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          @if (path() !== '/' && path() !== '/home') {
            <li class="nav-item">
              <a class="nav-link" routerLink="/" (click)="close()">
                首頁 <i class="bi bi-house"></i>
              </a>
            </li>
          }
          @if (path() !== '/collection') {
            <li class="nav-item">
              <a class="nav-link" routerLink="/collection" (click)="close()">
                藏書 <i class="bi bi-book"></i>
              </a>
            </li>
          }
          <li class="nav-item dropdown position-relative" (mouseenter)="isHover.set(true)" (mouseleave)="isHover.set(false)">
            @if (loginS.client()) {
              <a class="nav-link" routerLink="/loginG" (click)="close()">
                {{ loginS.client()!.cName }} <i class="bi bi-person"></i>
              </a>

              <ul class="dropdown-menu position-absolute" [class.show]="isHover()" style="right: 0; left: auto">
                <li><a class="dropdown-item drpItem">帳戶</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item drpItem" (click)="logout()">登出</a></li>
              </ul>
            }
            @else {
              <a class="nav-link" routerLink="/loginG" (click)="close()">
                登入 <i class="bi bi-person"></i>
              </a>
            }
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="search()">
              搜尋 <i class="bi bi-search"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<app-modal-search></app-modal-search>
