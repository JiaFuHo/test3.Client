<header class="sticky-top">
  <nav class="navbar navbar-expand-md">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">
        <img id="logoH" src="/images/logoH.png">
      </a>

      <button type="button" class="navbar-toggler border-0" (click)="toggle()">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="menu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          @if (path() !== '/' && path() !== '/home') {
            <li class="nav-item">
              <a class="nav-link" routerLink="/" (click)="close()">
                首頁 <i class="bi bi-house"></i>
              </a>
            </li>
          }
          @if (path() !== '/collection') {
            <li class="nav-item">
              <a class="nav-link" routerLink="/collection" (click)="close()">
                藏書 <i class="bi bi-book"></i>
              </a>
            </li>
          }
          <li class="nav-item">
            @if (loginS.client()) {
              <a class="nav-link" routerLink="/loginG" (click)="close(); logout()"> <!-- ??? -->
                {{ loginS.client()!.cName }} <i class="bi bi-person"></i>
              </a>
            }
            @else {
              <a class="nav-link" routerLink="/loginG" (click)="close()">
                登入 <i class="bi bi-person"></i>
              </a>
            }
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="search()">
              搜尋 <i class="bi bi-search"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<app-modal-search></app-modal-search>
