<section class="d-flex flex-column justify-content-center">
  <h1 class="mb-3 text-center">林間書語</h1>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xxl-6">
        <form class="row align-items-stretch p-5 bg-light rounded fs-5 fw-bold shadow-sm" [formGroup]="formLG"
          (ngSubmit)="loginG()">
          <div class="col-12 col-md-9 pe-md-4">
            <div class="d-flex align-items-center mb-3">
              <label class="form-label mb-0 me-3 text-nowrap">帳號 <i class="bi bi-person"></i></label>
              <app-ipt type="text" [controlName]="formLG.controls.Acc"></app-ipt>
            </div>
            <div class="d-flex align-items-center mb-md-0 mb-3">
              <label class="form-label mb-0 me-3 text-nowrap">密碼 <i class="bi bi-key"></i></label>
              <app-ipt type="password" [controlName]="formLG.controls.Pwd"></app-ipt>
            </div>
          </div>

          <div class="col-md-3 d-none d-md-flex align-items-end">
            <button type="submit" id="btnLGS" class="w-100 h-100">登入</button>
          </div>

          <div class="col-12 col-md-9 mt-3 pe-md-4">
            <div class="row">
              <div class="col-6 pe-2 text-end">
                <button type="button" id="btnG" class="btn w-100">
                  <i class="bi bi-google"></i> Google 登入
                </button>
              </div>
              <div class="col-6 pe-2">
                <button type="button" id="btnF" class="btn w-100">
                  <i class="bi bi-facebook"></i> Facebook 登入
                </button>
              </div>
            </div>
          </div>

          <div class="col-12 d-md-none mt-3">
            <button type="submit" id="btnLGL" class="w-100 py-3">登入</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <app-tree></app-tree>
</section>
