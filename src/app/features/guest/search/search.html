<section class="container d-flex flex-column justify-content-center">
  <div class="row">
    @if (bookInfo) {
    <div class="col-4 col-md-5 d-flex justify-content-end pe-4">
      <div class="row align-items-center">
        <img [src]="'data:image/*;base64,' + bookInfo.image" class="img-fluid object-fit-fill rounded shadow-sm">
      </div>
    </div>

    <div class="col-8 col-md-7 d-flex flex-column ps-4">
      <div>
        <h1>{{ bookInfo.title }}</h1>
      </div>
      <div class="row my-auto fs-4">
        <dt class="col-4 col-md-3 text-muted fw-normal mb-3">作者</dt>
        <dd class="col-8 col-md-9 mb-3">{{ bookInfo.author }}</dd>

        <dt class="col-4 col-md-3 text-muted fw-normal mb-3">譯者</dt>
        <dd class="col-8 col-md-9 mb-3">{{ bookInfo.translator }}</dd>

        <dt class="col-4 col-md-3 text-muted fw-normal mb-3">出版社</dt>
        <dd class="col-8 col-md-9 mb-3">{{ bookInfo.publisher }}</dd>

        <dt class="col-4 col-md-3 text-muted fw-normal mb-3">語言</dt>
        <dd class="col-8 col-md-9 mb-3">{{ bookInfo.language }}</dd>

        <dt class="col-4 col-md-3 text-muted fw-normal mb-3">ISBN</dt>
        <dd class="col-8 col-md-9 mb-3">{{ bookInfo.isbn }}</dd>
      </div>
    </div>
    }
    @else {

    }
  </div>
</section>
