<div class="p-3 bg-light rounded-4 shadow-lg">
  @if (favList().length > 0) {
    <table class="table table-striped align-middle w-100 m-0">
      <thead class="text-center">
        <tr>
          <th style="width: 10%"></th>
          <th style="width: 25%">書名</th>
          <th style="width: 25%">作者</th>
          <th style="width: 25%">出版社</th>
          <th style="width: 15%"></th>
        </tr>
      </thead>

      <tbody class="text-center">
        @for (x of favList(); track $index) {
          <tr>
            <td class="p-2">
              <img [src]="'data:image/*;base64,' + x.image" class="img-thumbnail">
            </td>
            <td>{{ x.title }}</td>
            <td>
              @for (y of x.authorInfos; track $index) {
                {{ y.author }}

                @if (!$last) { 、 }
              }
            </td>
            <td>{{ x.publisher }}</td>
            <td class="pe-3">
              <app-btn class="w-100 fs-5" btnClass="btn_BG-RED"
                (click)="deleteFav(x.collectionId.toString())">
                刪除最愛 <i class="bi bi-heartbreak-fill"></i>
              </app-btn>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <app-pagination [totalCount]="totalCount()" [page]="page()" [size]="size()"
          (pageX)="flip($event)"></app-pagination>
  }
  @else {
    <div class="d-flex justify-content-center align-items-center" style="height: 320px">
      <div class="fs-5 text-muted">查無相關紀錄</div>
    </div>
  }
</div>
