<section class="d-flex flex-column justify-content-center">
  <h1 class="mb-3 text-center">圖書管理系統</h1>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xxl-6">
        <form class="row align-items-stretch p-5 bg-light rounded fs-5 fw-bold shadow-sm" [formGroup]="formLA"
          (ngSubmit)="loginA()">
          <div class="col-12 col-md-9 pe-md-4">
            <div class="d-flex align-items-center mb-3">
              <label class="form-label mb-0 me-3 text-nowrap">帳號 <i class="bi bi-person"></i></label>
              <app-ipt type="text" [controlName]="formLA.controls.Acc"></app-ipt>
            </div>
            <div class="d-flex align-items-center mb-md-0 mb-3">
              <label class="form-label mb-0 me-3 text-nowrap">密碼 <i class="bi bi-key"></i></label>
              <app-ipt type="password" [controlName]="formLA.controls.Pwd"></app-ipt>
            </div>
          </div>

          <div class="col-12 col-md-3 d-flex align-items-end">
            <app-btn type="submit" id="btnLG" class="btn_BG-GREEN1 w-100 h-100">登入</app-btn>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
